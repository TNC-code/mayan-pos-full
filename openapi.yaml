openapi: 3.0.3
info:
  title: POS Inventory API
  version: 2.1.0
  description: |
    POS Inventory multi-terminal (2+ POS / multi user, ACID via PostgreSQL).
    Aturan bisnis ditegakkan DB (trigger): anti-oversell, harga jual >= harga beli,
    anti-overpay, void auditable. Pembayaran mendukung PARTIAL & multi metode
    (CASH / BANK_TRANSFER / configurable via menu payment_methods).

    **RBAC v2 + amandemen FE-11** — KASIR = operator (semua mutasi: master, pembelian, POS,
    opname, payment-methods, profil toko), OWNER = monitor read-only (403 di semua mutasi
    selain opex). Pengeluaran operasional **OWNER sepenuhnya** (revisi user): input + baca
    `POST /expenses`, `PATCH /expenses/{id}`, `GET /expenses`, `GET /expenses/{id}` hanya OWNER;
    KASIR 403 di keempatnya. Seluruh `/reports/*` hanya OWNER. Semua GET lain terbuka untuk
    kedua role.
    **Pemisahan data uji (v2.1)** — `sales`, `operational_expenses` dan `supplier_returns`
    punya flag `is_test`; semua laporan production-only mengecualikannya secara default dan
    membuka lewat `?include_test=true` (`GET /sales`, `GET /expenses`, `GET /reports/pnl`).
  x-auth-order-books: |
    `POST /order-books` (tag `Order Books`) adalah satu-satunya endpoint dengan DUA jalur auth:
      1. header `X-Internal-Key` == env `INTERNAL_API_KEY` -> bot WhatsApp (tanpa JWT),
         `created_by` = user sistem `bot` (seed migration 0009, `is_active=false`).
      2. tanpa header itu -> JWT biasa, role KASIR (kasir membuat order manual).
    Header yang ada tapi salah -> `401 INTERNAL_KEY_INVALID` (tidak jatuh ke jalur JWT).
    `INTERNAL_API_KEY` belum diset di server -> semua panggilan internal key ditolak 401.
    Endpoint order book lain (`GET`, `PATCH`/`DELETE` item, `/status`, `/convert`) tetap
    JWT biasa + RBAC KASIR untuk mutasinya.
  x-rbac: |
    KASIR = operator: semua POST/PATCH/DELETE (mutasi) KECUALI opex.
    OWNER = monitor + opex: semua GET; mutasi selain `POST/PATCH /expenses` tetap 403.
    Pengecualian: /expenses* (GET/POST/PATCH) dan seluruh /reports/* hanya OWNER (KASIR 403).
servers:
  - url: http://localhost:3000/api/v1
    description: Local
tags:
  - name: Auth
  - name: Products
  - name: Categories
  - name: Payment Methods
  - name: Purchases
  - name: Sales
  - name: Payments
  - name: Stock
  - name: Opnames
  - name: Supplier Returns
  - name: Expenses
  - name: Reports
  - name: Order Books
  - name: Internal
security:
  - bearerAuth: []

x-error-codes:
  REFUND_QTY_EXCEEDED: '422 - qty refund melebihi sisa item yang terjual'
  REFUND_AMOUNT_EXCEEDED: '422 - total refund melebihi sisa uang yang dibayar'
  REFUND_NOT_ALLOWED: '422 - sales UNPAID; gunakan void'
  VOID_ITEM_MISMATCH: '422 - sale_item_id bukan item dari penjualan tsb / refund tanpa item'
  DAMAGED_QTY_INSUFFICIENT: '409 - qty_damaged batch tidak cukup (retur distributor / opname)'
  SUPPLIER_RETURN_SETTLED: '409 - retur distributor sudah REFUNDED/WRITTEN_OFF'
  TRANSITION_NOT_ALLOWED: '409 - status sales tidak dapat diubah lagi'
  VOID_NOT_ALLOWED: '409 - sales sudah dibayar; gunakan retur/refund'
  FORBIDDEN: '403 - role tidak berwenang (RBAC)'
  INTERNAL_KEY_INVALID: '401 - X-Internal-Key kosong/salah, atau INTERNAL_API_KEY belum diset di server'
  ORDER_NOT_FOUND: '404 - order book tidak ada'
  ORDER_ITEM_NOT_FOUND: '404 - item bukan milik order book tsb / tidak ada'
  ORDER_ALREADY_DONE: '409 - order sudah DONE ke penjualan lain'
  ORDER_STATUS_TRANSITION: '409 - transisi status order book tidak diizinkan (DONE/CANCELLED tidak bisa diubah)'
  ORDER_CONVERT_INVALID: '422 - penjualan tujuan convert tidak ada atau bukan COMPLETED'
  ORDER_LAST_ITEM: '422 - item terakhir tidak boleh dihapus (order minimal 1 item)'

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login kasir/owner (JWT + refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  refresh_token: { type: string }
                  role: { type: string, enum: [OWNER, KASIR] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limit (10x per 15 menit per IP) }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Tukar refresh token -> JWT baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: JWT baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      role: { type: string, enum: [OWNER, KASIR] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout — cabut refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil user dari token (+ status subscription)
      description: |
        Field `user` TIDAK berubah sejak versi lama. `modules`, `account`, dan `hosting_mode`
        bersifat **additive** (MP-8) — FE lama yang hanya membaca `user` tetap kompatibel.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      full_name: { type: string }
                      role: { type: string, enum: [OWNER, KASIR] }
                  modules:
                    type: object
                    description: 'Entitlement modul langganan (kode -> valid_until + status aktif). Kode yang tidak ada berarti modul belum dibeli = terkunci.'
                    additionalProperties:
                      type: object
                      properties:
                        valid_until: { type: string, nullable: true }
                        active: { type: boolean }
                  account:
                    type: object
                    properties:
                      status: { type: string, enum: [TRIAL, ACTIVE, EXPIRED, SUSPENDED] }
                      trial_ends_at: { type: string, format: date-time, nullable: true }
                      trial_days_left: { type: integer, nullable: true }
                      paket_aktif:
                        type: string
                        nullable: true
                        description: 'Kode paket inti yang dibayar; null selama TRIAL / EXPIRED / SUSPENDED.'
                  hosting_mode:
                    type: string
                    enum: [shared]

  /products:
    get:
      tags: [Products]
      summary: List produk (filter barcode/sku/nama)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: nama/sku/barcode }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Products]
      summary: Tambah produk — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Products]
      summary: Detail produk + stok on hand (query langsung tanpa view)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductStock' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Ubah produk — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Nonaktifkan produk (soft, stok histori tetap) — KASIR only
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  is_active: { type: boolean }

  /categories:
    get:
      tags: [Categories]
      summary: List kategori
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Categories]
      summary: Tambah kategori — KASIR only
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                type_id: { type: integer }
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }

  /categories/{id}:
    patch:
      tags: [Categories]
      summary: Ubah kategori — KASIR only
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type_id: { type: integer, nullable: true }
                is_active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }

  /product-types:
    get:
      tags: [Categories]
      summary: List tipe produk
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
    post:
      tags: [Categories]
      summary: Tambah tipe produk — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }

  /customers:
    get:
      tags: [Products]
      summary: List customer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Customer' }
    post:
      tags: [Products]
      summary: Tambah customer — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Products]
      summary: Detail customer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Ubah customer — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /payment-methods:
    get:
      tags: [Payment Methods]
      summary: List metode pembayaran (menu)
      parameters:
        - { name: active_only, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentMethod' }
    post:
      tags: [Payment Methods]
      summary: Tambah metode (mis. QRIS) — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }

  /payment-methods/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Payment Methods]
      summary: Detail metode pembayaran
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Payment Methods]
      summary: Ubah / aktif-nonaktifkan / set rekening bank — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }

  /purchases:
    get:
      tags: [Purchases]
      summary: Riwayat pembelian/batch (barang masuk)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockBatch' }
    post:
      tags: [Purchases]
      summary: Catat pembelian bulk (1 batch + movement IN, atomic) — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockBatch' }

  /purchases/batches/{id}:
    get:
      tags: [Purchases]
      summary: Detail batch + sisa stoknya
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockBatch' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Purchases]
      summary: Koreksi salah input barang masuk — KASIR only
      description: |
        Perbaiki qty / harga beli / markup / expired / supplier / catatan pada batch
        yang **belum terpakai** (belum ada penjualan, opname, retur distributor, atau
        mutasi keluar lain). Detail guard dan efek samping lihat `BatchUpdate`.

        Efek samping:
        * perubahan qty → movement `ADJUSTMENT` baru di `stock_movements` (ledger utuh,
          qty_remaining berubah via trigger);
        * perubahan `unit_cost`/markup pada batch TERBARU → `harga_beli`/`harga_jual`
          produk ikut terselaraskan (trigger 0011); batch lama tidak menimpa harga produk;
        * response 200 = row batch setelah koreksi (`suggested_price` dihitung ulang otomatis).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdate' }
      responses:
        '200':
          description: Batch terkoreksi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}/batches:
    get:
      tags: [Purchases]
      summary: Picker batch satu produk untuk layar kasir (baruplan #1)
      description: |
        Daftar batch milik satu produk dengan sisa stok, harga beli (floor nego) dan
        harga jual usulan (suggested_price). Dipakai modal "Detail Item" kasir untuk
        memilih batch saat produk sama datang dari vendor berbeda dengan harga beda.
        Urutan FIFO: `expired_date NULLS LAST, id ASC` — sama dengan auto-FIFO `POST /sales`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: available_only, in: query, schema: { type: boolean, default: true }, description: 'hanya batch dengan qty_remaining > 0' }
        - { name: qty, in: query, schema: { type: number }, description: 'opsional — minta saran alokasi FIFO untuk qty ini: tiap batch diberi `suggested_qty` (batch terlama penuh dulu). Bila total stok < qty, seluruh batch terisi penuh dan kekurangan = qty − Σ suggested_qty (divalidasi ulang saat POST /sales).' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockBatch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sales:
    get:
      tags: [Sales]
      summary: Riwayat penjualan (filter tanggal/status bayar)
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: payment_status, in: query, schema: { type: string, enum: [UNPAID, PARTIAL, PAID] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sale' }
    post:
      tags: [Sales]
      summary: Buat penjualan (POS checkout) — atomic + idempotent — KASIR only
      description: |
        Satu request = 1 DB transaction (sales + items + payment awal optional).
        Gunakan header Idempotency-Key (UUID per submit) agar retry tidak dobel transaksi.
        Response 409 jika stok tidak cukup; 422 jika harga jual < harga beli.

        **Aturan kasbon**: checkout TANPA `payment` (= nota UNPAID, bayar saat/after
        pengiriman) **wajib menyertakan `customer_id`** — piutang harus atas nama.
        Pelanggaran -> 400 VALIDATION_ERROR. Bayar langsung (payment ada) boleh
        tanpa customer (walk-in).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /sales/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Sales]
      summary: Detail penjualan + items + payments + sisa tagihan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sales/{id}/void:
    post:
      tags: [Sales]
      summary: Void penjualan berlabel kondisi (stok kembali, auditable) — KASIR only
      description: |
        Hanya untuk penjualan **UNPAID** (yang sudah dibayar wajib lewat refund).
        Tanpa `items` = void penuh semua item kondisi GOOD (perilaku lama, kompatibel FE lama).
        Dengan `items` = hanya item yang disebut yang kembali, dan `condition` menentukan
        kolom stok mana yang bertambah: GOOD -> `qty_remaining` (bisa dijual lagi),
        RUSAK -> `qty_damaged` (karantina, tidak ikut terjual).
        Semua movement tercatat di `stock_movements` dengan `reference_type='VOID'`.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnItemsInput' }
      responses:
        '200':
          description: OK — status VOIDED, movement IN tercatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: OWNER tidak diizinkan (kasir = operator) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /sales/{id}/receipt:
    get:
      tags: [Sales]
      summary: Nota/struk lengkap dalam JSON (header toko + item + pembayaran) untuk dirender frontend
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store:
    get:
      tags: [Auth]
      summary: Profil toko/perusahaan (header nota) — semua role
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreProfile' }
    patch:
      tags: [Auth]
      summary: Ubah profil toko — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreProfileInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreProfile' }
        '403': { description: "OWNER tidak diizinkan (RBAC v2 - kasir = operator)" }

  /sales/{id}/refund:
    post:
      tags: [Sales]
      summary: Retur + refund parsial / berlabel kondisi (PAID) — KASIR only
      description: |
        Retur untuk penjualan yang **sudah dibayar**: uang dicatat di tabel `refunds`,
        barang kembali ke gudang per item dan per kondisi.
        Tanpa `items` = refund penuh semua sisa item, semua GOOD (perilaku lama, kompatibel FE lama).
        Dengan `items` = refund **parsial** (`qty` boleh sebagian dari qty jual) dan
        `condition` GOOD/RUSAK per item (boleh campur untuk satu sale_item).
        `method_id` opsional; default = metode pembayaran terakhir.
        Status: parsial -> tetap `COMPLETED` (hanya `refunded_amount` naik);
        semua item habis -> `RETURNED`.
        Penjualan UNPAID ditolak 422 (`REFUND_NOT_ALLOWED`) — pakai void.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnItemsInput' }
      responses:
        '200':
          description: OK — refund record + detail per item + status (COMPLETED/RETURNED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: OWNER tidak diizinkan (kasir = operator) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /cash-sessions:
