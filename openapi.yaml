      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashSession' }

  /cash-sessions/open:
    post:
      tags: [Payments]
      summary: Buka shift kasir (saldo awal kas) — KASIR only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opening_cash]
              properties:
                opening_cash: { type: number }
                note: { type: string }
      responses:
        '201':
